[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-learner"
version = "0.0.1"
description = "GraphRAG over a codebase, for agents and for humans"
readme = "README.md"
# 3.12+, and the floor is deliberate. It is not that 3.11 lacks a needed feature --
# it is that a 3.11.0rc build lacks `sys.get_int_max_str_digits` (added in 3.11.0
# final), which modern torch imports unconditionally, producing an error message
# that points nowhere near the cause. Requiring 3.12 makes that class of interpreter
# drift impossible rather than merely documented.
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
    "torch>=2.5",
]
# Cross-encoder reranking. Separate from `embed` because it is opt-in and pulls
# ~3.4GB of weights, and because `accelerate` is needed ONLY here:
# `zerank-1-small-reranker` ships remote code that loads its model with a
# `device_map`, which transformers refuses to honour without accelerate. Left
# implicit, that surfaces as a ValueError from inside a vendored file rather than
# as a missing dependency, which is a bad half-hour for whoever hits it.
rerank = [
    "sentence-transformers>=3.0",
    "torch>=2.5",
    "accelerate>=1.0",
]
# The MCP server. Optional rather than a core dependency: `mcp` pulls in pydantic,
# starlette and uvicorn, and a user who only wants `codelearner search` in a shell
# should not install an ASGI stack to get it. `tests/test_mcp.py` skips itself when
# this extra is absent, the same way the dense tests skip without sqlite-vec.
mcp = [
    "mcp>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "mcp>=2.0",
]

[project.scripts]
# The human entry point. `main` returns an exit code rather than calling sys.exit,
# which is what console_scripts expects and what makes it callable from a test
# without catching SystemExit.
codelearner = "codelearner.cli:main"
# The agent entry point. Same convention, and the name an MCP client's config block
# launches -- so it is part of the published interface, not a convenience alias.
codelearner-mcp = "codelearner.server:main"

[tool.setuptools.packages.find]
include = ["codelearner*"]

[tool.setuptools.package-data]
codelearner = ["*.sql", "eval/gold/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test
